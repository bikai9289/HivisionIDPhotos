<!doctype html>
<html lang="{{ lang }}">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>{{ title }}</title>
    <meta name="description" content="{{ description }}" />
    <link rel="canonical" href="{{ canonical }}" />
    <link rel="alternate" href="{{ base_url }}/zh" hreflang="zh-CN" />
    <link rel="alternate" href="{{ base_url }}/" hreflang="en" />
    <link rel="alternate" href="{{ base_url }}/" hreflang="x-default" />

    <!-- OpenGraph -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="{{ title }}" />
    <meta property="og:description" content="{{ description }}" />
    <meta property="og:url" content="{{ canonical }}" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="{{ title }}" />
    <meta name="twitter:description" content="{{ description }}" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="/static/styles.css" />
    <link rel="apple-touch-icon" sizes="180x180" href="/logo/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/logo/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/logo/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/logo/favicon.ico" />
    <link rel="manifest" href="/logo/site.webmanifest" />
  
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "AI IDPhotos",
      "applicationCategory": "PhotoEditor",
      "operatingSystem": "Web",
      "url": "{{ base_url }}",
      "offers": { "@type": "Offer", "price": "0", "priceCurrency": "USD" }
    }
    </script>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZF42T7R7W1"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-ZF42T7R7W1');
    </script>

  </head>
  <body>
    <a class="skip-link" href="#main">Skip to content</a>
    <header class="site-header" role="banner">
      <div class="container row between center">
        <a class="brand" href="/" aria-label="AI IDPhotos Home">AI IDPhotos</a>
        <nav class="main-nav" aria-label="Primary">
          {% if lang == 'en' %}
            <a href="/#features">Features</a>
            <a href="/#howto">How it works</a>
            <a href="/en/spec/one-inch-photo">Size Specs</a>
            <a class="btn ghost" href="/tool">Get Started</a>
          {% else %}
            <a href="/#features">功能</a>
            <a href="/#howto">使用步骤</a>
            <a href="/spec/one-inch-photo">规格尺寸</a>
            <a class="btn ghost" href="/tool">开始使用</a>
          {% endif %}
        </nav>
      </div>
    </header>

    {% block body %}{% endblock %}

    <footer class="site-footer">
      <div class="container small">
        <div>© {{ now.year }} AI IDPhotos</div>
        <div class="muted">
          {% if lang == 'en' %}
            <a href="/zh">中文</a>
          {% else %}
            <a href="/en">English</a>
          {% endif %}
        </div>
      </div>
    </footer>
  </body>
  </html>
